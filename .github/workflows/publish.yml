name: Publish
# npm trusted publishing (OIDC, configured on the package's npm settings page):
# no token anywhere — id-token: write is the whole credential.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    # macOS: the sandbox tests exercise seatbelt, the platform the agent ships on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Pack and refuse to republish an existing version
        run: |
          set -euo pipefail
          name=$(python3 -c 'import json;print(json.load(open("package.json"))["name"])')
          version=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; bump the version first" >&2
            exit 1
          fi
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "NPM_DIST_TAG=$tag" >> "$GITHUB_ENV"
          # bun pm pack drops bun.lock from the tarball; npm pack honours "files" (desktop needs the lock for --frozen-lockfile).
          npm pack --ignore-scripts --pack-destination ./dist >/dev/null && mv ./dist/*.tgz ./dist.tgz
      # bun publish cannot do OIDC; npm 11.5+ (bundled with Node 24) can.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish ./dist.tgz --provenance --access public --tag "$NPM_DIST_TAG"
