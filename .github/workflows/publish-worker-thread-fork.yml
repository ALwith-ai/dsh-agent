name: Publish worker-thread fork
# Publishes @nyssance/dsh-code-runtime-worker-thread — the exact upstream artifact
# plus the Bun TypeScript-stripping fallback (see forks/dsh-code-runtime-worker-thread).
# Manual by design: run it after every family bump that changes UPSTREAM_VERSION.
on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Upstream @deepseek-ai/dsh-code-runtime-worker-thread version (default: forks/…/UPSTREAM_VERSION)
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Build the fork from the upstream artifact
        run: bun forks/dsh-code-runtime-worker-thread/build.ts ${{ inputs.upstream_version }}
      - name: Refuse to republish an existing version
        run: |
          set -euo pipefail
          tgz=$(ls forks/dsh-code-runtime-worker-thread/dist/*.tgz)
          name=$(tar -xOzf "$tgz" package/package.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["name"])')
          version=$(tar -xOzf "$tgz" package/package.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; bump UPSTREAM_VERSION (or pass upstream_version) instead of republishing" >&2
            exit 1
          fi
          echo "publishing $name@$version"
      # bun publish cannot use npm trusted publishing (OIDC); npm 11.5+ can.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish forks/dsh-code-runtime-worker-thread/dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
